name: Build exe

on:
  push:
    paths:               # only rebuild when the inputs change
      - Randomize.py
  workflow_dispatch:

permissions:
  contents: write        # lets the workflow push the exe back

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyinstaller pyyaml

      - name: Build exe
        run: pyinstaller --onefile Randomize.py

      - name: Commit exe to repo
        shell: bash
        run: |
          cp dist/Randomize.exe Randomize.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Randomize.exe
          git diff --cached --quiet || git commit -m "Build exe"
          git push
